name: Evolve

on:
  schedule:
    - cron: '0 */16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure git
        run: |
          git config user.name "paimon[bot]"
          git config user.email "paimon[bot]@users.noreply.github.com"

      - name: Run evolution
        env:
          PAIMON_API_KEY: ${{ secrets.PAIMON_API_KEY }}
          PAIMON_MODEL: ${{ vars.PAIMON_MODEL || 'gpt-5.4' }}
        run: npm run evolve

      - name: Final push (safety net)
        run: |
          git reset HEAD -- .github/workflows/ 2>/dev/null || true
          git checkout -- .github/workflows/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "paimon: ${DATE} safety-net commit" || true
          fi
          git push --all 2>/dev/null || echo "Already pushed by agent or no changes"
